name: recovery-lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q -m 'not stack' --junitxml=.lab/tests.xml
  fault-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_STACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock .
      - run: docker compose up -d --build
      - run: python -m pytest -q --junitxml=.lab/tests.xml
      - run: recovery-lab run --output .lab/demo
      - run: python scripts/verify_observability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-stack-evidence
          path: .lab/
          include-hidden-files: true
          retention-days: 14
      - run: docker compose down
        if: always()
